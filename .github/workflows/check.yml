# Reader and Swift checks for the maintenance branch.
# A green run matches the committed vectors. It is not an authority proof.
# GitHub Actions here must be owned by Ergentics and pinned to a full SHA.
# actions/checkout is not eligible, so checkout is a git fetch.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  reader:
    name: Rust reader and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install Rust 1.99
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test locked vectors
        working-directory: rust/commitment-reader
        run: cargo test --locked
      - name: Build wasm32 reader
        working-directory: rust/commitment-reader
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Check two hashes from the wasm module
        working-directory: rust/commitment-reader
        run: node wasm-check.mjs
      - name: Bench smoke
        working-directory: rust/commitment-reader
        run: cargo run --locked --release --bin commitment-bench -- --iterations 2

  swift:
    name: Swift package
    runs-on: ubuntu-latest
    # Swift 6.2's discovered-test list cannot mix sync and async methods on an
    # @MainActor suite. The suites are async throughout so this image can run them.
    container: swift:6.2
    steps:
      - name: Checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Test
        run: swift test --scratch-path /tmp/foundation-build
      - name: Bench smoke
        run: swift run --scratch-path /tmp/foundation-build FoundationBench --iterations 2
