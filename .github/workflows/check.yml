# Reader, Swift, and traceability-index checks for the maintenance branch.
# A green run matches the committed vectors and the section 9 index. It is not an authority proof.
# GitHub Actions here must be owned by Ergentics and pinned to a full SHA.
# actions/checkout is not eligible, so checkout is a git fetch.
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: "check-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  reader:
    name: Rust reader and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Install Rust 1.99
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
          . "$HOME/.cargo/env"
          rustup target add wasm32-unknown-unknown
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Test locked vectors
        working-directory: rust/commitment-reader
        run: cargo test --locked
      - name: Build wasm32 reader
        working-directory: rust/commitment-reader
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Check two hashes from the wasm module
        working-directory: rust/commitment-reader
        run: node wasm-check.mjs
      - name: Bench smoke
        working-directory: rust/commitment-reader
        run: cargo run --locked --release --bin commitment-bench -- --iterations 2

  swift:
    name: Swift package
    runs-on: ubuntu-latest
    # Swift 6.4.1 is the latest 6.4 stable. The suites stay async so the
    # discovered-test list has one element type.
    container: swift:6.4.1
    steps:
      - name: Checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # The image resolver sometimes cannot see github.com after apt.
          if ! getent hosts github.com >/dev/null 2>&1; then
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | cat - /etc/resolv.conf > /tmp/resolv.conf
            cp /tmp/resolv.conf /etc/resolv.conf
          fi
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          n=0
          until git fetch --depth 1 origin "${GITHUB_SHA}"; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              exit 128
            fi
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | cat - /etc/resolv.conf > /tmp/resolv.conf
            cp /tmp/resolv.conf /etc/resolv.conf
            sleep $((n * 2))
          done
          git checkout --detach FETCH_HEAD
      - name: Test
        run: swift test --scratch-path /tmp/foundation-build
      - name: Bench smoke
        run: swift run --scratch-path /tmp/foundation-build FoundationBench --iterations 2

  rails-index:
    name: Rails traceability index
    runs-on: ubuntu-latest
    # Ruby 4.0.7 matches the local recorder. Rails 8.1.4 indexes section 9.
    # The image is a container, not a GitHub Action.
    container: ruby:4.0.7
    steps:
      - name: Checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # ruby:4.0.7 has failed this fetch with "Could not resolve host: github.com"
          # after apt succeeded. Retry, and add public resolvers if the name is missing.
          if ! getent hosts github.com >/dev/null 2>&1; then
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | cat - /etc/resolv.conf > /tmp/resolv.conf
            cp /tmp/resolv.conf /etc/resolv.conf
          fi
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          n=0
          until git fetch --depth 1 origin "${GITHUB_SHA}"; do
            n=$((n + 1))
            if [ "$n" -ge 4 ]; then
              exit 128
            fi
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | cat - /etc/resolv.conf > /tmp/resolv.conf
            cp /tmp/resolv.conf /etc/resolv.conf
            sleep $((n * 2))
          done
          git checkout --detach FETCH_HEAD
      - name: Test
        working-directory: traceability
        run: |
          bundle install
          bin/rails test

  continuity:
    name: E26 continuity counts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Check retained counts
        run: |
          python3 reference/check_continuity.py
          python3 reference/check_e27_candidates.py
