[package]
name = "commitment-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "Off-process reader for CF-STATE-v1 and PL-LOG-v1. Not the ledger and not an authority."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "=0.10.8"

[dev-dependencies]
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
